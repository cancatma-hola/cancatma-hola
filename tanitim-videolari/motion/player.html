<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>MTS Hijyen B2B · Video oynatıcı</title>
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/300.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="kit/kit.css">
</head>
<body>
<script src="lib.js"></script>
<script src="kit/kit.js"></script>
<script src="kit/illus.js"></script>
<script src="build/shots.js"></script>
<script>
  // ?v=E1 → videos/E1.js + build/E1-dur.js
  const V = new URLSearchParams(location.search).get('v');
  const load = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = r; document.body.appendChild(s); });
  (async () => {
    await load(`videos/${V}.js`);
    await load(`build/${V}-dur.js`);
    mount(VIDEO, window.VO_DUR || {});
    await document.fonts.ready;
    await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    window.render(0);
    window.READY = true;
  })();
</script>
</body>
</html>
