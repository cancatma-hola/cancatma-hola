<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>B · Gece Vardiyası</title>
<link rel="stylesheet" href="../node_modules/@fontsource/space-grotesk/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/space-grotesk/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/500.css">
<style>
  :root {
    --bg: #07090A; --tx: #EDEFEE; --tx2: rgba(237,239,238,.55); --tx3: rgba(237,239,238,.26);
    --line: rgba(255,255,255,.08); --cell: rgba(255,255,255,.035); --accent: #3DF2D6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--tx); }
  body { font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }
  .glow { inset: 0; background: radial-gradient(60% 70% at 72% 45%, rgba(61,242,214,.06), transparent 70%); }
  .hdr { top: 62px; font-size: 15px; color: var(--tx2); display: flex; align-items: center; gap: 14px; }
  .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

  .feed { left: 120px; top: 150px; width: 780px; }
  .row { position: relative; height: 76px; border-bottom: 1px solid var(--line); font-family: 'JetBrains Mono', monospace;
    font-size: 19px; white-space: nowrap; }
  .row .ink > span { position: absolute; top: 26px; }
  .row .st { font-size: 13px; letter-spacing: .08em; top: 25px; padding: 3px 8px; border: 1px solid var(--tx3); }
  .row .ink { position: absolute; inset: 0; }
  .cursor { width: 11px; height: 24px; background: var(--accent); top: 24px; }
  .corner { width: 22px; height: 22px; border-color: var(--accent); border-style: solid; border-width: 0; }
  .wire { height: 1px; background: var(--accent); transform-origin: left; }

  .lbl { font-size: 14px; color: var(--tx3); }
  .ono { left: 1000px; top: 176px; font-weight: 700; font-size: 168px; line-height: 1; letter-spacing: -.04em; white-space: nowrap; }
  .ono span { display: inline-block; width: .62em; text-align: center; }
  .cust { left: 1004px; top: 370px; font-size: 34px; font-weight: 500; color: var(--tx2); white-space: nowrap; }
  .board { left: 1000px; top: 500px; display: flex; gap: 5px; }
  .cellf { position: relative; width: 54px; height: 82px; background: var(--cell); border: 1px solid var(--line);
    font-weight: 700; font-size: 48px; line-height: 82px; text-align: center; overflow: hidden; }
  .cellf::after { content: ''; position: absolute; left: 0; right: 0; top: 40px; height: 2px; background: var(--bg); }
  .segs { left: 1000px; top: 640px; display: flex; gap: 12px; }
  .seg { width: 145px; }
  .seg .bar { height: 6px; background: rgba(255,255,255,.09); position: relative; overflow: hidden; }
  .seg .bar i { position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  .seg .mono { font-size: 12px; margin-top: 12px; color: var(--tx3); }
  .koli { left: 1000px; top: 760px; }
  .koli .big { font-weight: 700; font-size: 96px; letter-spacing: -.03em; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .koli .big em { font-style: normal; color: var(--tx3); }

  .end { inset: 0; background: var(--bg); }
  .end .m { overflow: hidden; padding: 0 .12em .12em 0; }
  .end .m > div { will-change: transform; }
  .end .s1 { left: 116px; top: 250px; font-weight: 700; font-size: 230px; line-height: .95; letter-spacing: -.05em; white-space: nowrap; }
  .end .s2 { color: var(--accent); }
  .end .s3 { left: 120px; top: 880px; font-size: 18px; color: var(--tx2); }
  .end .s3 b { font-weight: 500; color: var(--tx); text-transform: none; }
</style>
</head>
<body>
<div class="main abs" style="inset:0">
  <div class="abs glow"></div>
  <div class="abs hdr mono" style="left:120px"><div class="pulse"></div>Canlı sipariş akışı</div>
  <div class="abs hdr mono" style="right:120px">Örnek veri · Bayi ağı</div>

  <div class="abs feed"></div>
  <div class="abs cursor"></div>
  <div class="corners"></div>
  <div class="abs wire"></div>

  <div class="abs lbl mono" style="left:1004px;top:160px" id="l1">Sipariş</div>
  <div class="abs ono"></div>
  <div class="abs cust">Otel Satın Alma · 48 koli · 6 kalem</div>
  <div class="abs lbl mono" style="left:1004px;top:466px" id="l2">Durum</div>
  <div class="abs board"></div>
  <div class="abs segs"></div>
  <div class="abs koli"><div class="lbl mono">Hazırlanan koli</div><div class="big"><span id="kn">00</span><em> / 48</em></div></div>
</div>

<div class="end abs">
  <div class="abs s1">
    <div class="m"><div class="w1">Her sipariş</div></div>
    <div class="m"><div class="w2 s2">görünür.</div></div>
  </div>
  <div class="abs s3 mono"><div class="m"><div class="w3">MTS Hijyen B2B &nbsp;·&nbsp; <b>panel.mtshijyen.com</b></div></div></div>
</div>

<script src="../lib.js"></script>
<script>
  const ROWS = [
    ['09:02', '#24807', 'Bayi · Ege 04', '12 koli', 'Teslim'],
    ['09:04', '#24809', 'Otel · Bodrum', '22 koli', 'Kargoda'],
    ['09:06', '#24810', 'Hastane · İzmir', '36 koli', 'Hazırlık'],
    ['09:12', '#24815', 'Otel Satın Alma', '48 koli', 'Yeni'],
    ['09:15', '#24816', 'Okul · Manisa', '8 koli', 'Yeni'],
    ['09:19', '#24818', 'Fabrika · Aydın', '64 koli', 'Onaylandı'],
    ['09:21', '#24819', 'Bayi · Ege 11', '20 koli', 'Yeni'],
    ['09:24', '#24821', 'Restoran · Çeşme', '6 koli', 'Yeni'],
    ['09:26', '#24822', 'Belediye · Kemalpaşa', '90 koli', 'Onaylandı'],
  ];
  const SEL = 3, ROW_H = 76, FEED_X = 120, FEED_Y = 150, CH = 11.4; // CH: mono karakter genişliği (19px)
  const COLS = [0, 92, 196, 470, 590];
  const WORDS = ['YENİ', 'ONAYLANDI', 'HAZIRLANIYOR', 'KARGODA', 'TESLİM EDİLDİ'];
  const CHIP = ['Yeni', 'Onaylandı', 'Hazırlık', 'Kargoda', 'Teslim'];
  const T = [3.0, 4.2, 5.1, 6.3, 7.2];
  const NCELL = 13, GLYPHS = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ0123456789';

  const feed = $('.feed');
  ROWS.forEach(r => {
    feed.insertAdjacentHTML('beforeend', `<div class="row"><div class="ink">${r.map((c, i) =>
      `<span ${i === 4 ? 'class="st mono"' : ''} style="left:${COLS[i]}px;${i === 0 ? 'color:var(--tx3)' : ''}">${c}</span>`).join('')}</div></div>`);
  });
  const corners = $('.corners');
  [[0, 0, 'top', 'left'], [1, 0, 'top', 'right'], [0, 1, 'bottom', 'left'], [1, 1, 'bottom', 'right']].forEach(([cx, cy, v, h]) =>
    corners.insertAdjacentHTML('beforeend', `<div class="abs corner" data-x="${cx}" data-y="${cy}" style="border-${v}-width:2px;border-${h}-width:2px"></div>`));
  for (let i = 0; i < NCELL; i++) $('.board').insertAdjacentHTML('beforeend', '<div class="cellf"></div>');
  ['Yeni', 'Onay', 'Hazırlık', 'Kargo', 'Teslim'].forEach(s =>
    $('.segs').insertAdjacentHTML('beforeend', `<div class="seg"><div class="bar"><i></i></div><div class="mono">${s}</div></div>`));
  const ONO = '#24815';
  $('.ono').innerHTML = [...ONO].map(() => '<span></span>').join('');

  const wordAt = t => { let k = -1; for (let j = 0; j < 5; j++) if (t >= T[j]) k = j; return k; };

  window.render = function (t) {
    const fr = Math.floor(t * 30);
    $('.pulse').style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t * 4.2));
    $$('.hdr').forEach(h => h.style.opacity = E.outExpo(seg(t, 0.1, 0.6)));

    // 1 · akış satırları daktilo gibi yazılır (karakter adımlı kırpma)
    let cur = null;
    $$('.row').forEach((row, i) => {
      const a = 0.3 + i * 0.13, p = seg(t, a, a + 0.42);
      const w = Math.floor((p * 700) / CH) * CH;
      row.querySelector('.ink').style.clipPath = `inset(0 ${780 - w}px 0 0)`;
      row.style.borderBottomColor = p > 0 ? '' : 'transparent';
      if (p > 0 && p < 1) cur = { x: FEED_X + w, y: FEED_Y + i * ROW_H };
      const dim = E.outExpo(seg(t, 2.15, 2.55));
      row.style.opacity = i === SEL ? 1 : 1 - dim * 0.76;
    });
    css('.cursor', cur ? { left: cur.x + 'px', top: (cur.y + 24) + 'px', opacity: fr % 2 ? 1 : 0.85 } : { opacity: 0 });

    // seçili satırın durum etiketi panel ile senkron
    const k = wordAt(t);
    const chip = $$('.row')[SEL].querySelector('.st');
    chip.textContent = CHIP[Math.max(0, k)];
    chip.style.color = k >= 1 ? 'var(--bg)' : '';
    chip.style.background = k >= 1 ? 'var(--accent)' : '';
    chip.style.borderColor = k >= 1 ? 'var(--accent)' : '';

    // 2 · seçim köşeleri + bağlantı teli
    const cp = spring(t - 2.2, SPRING.snappy);
    const top = FEED_Y + SEL * ROW_H, cxm = FEED_X + 390, cym = top + ROW_H / 2;
    $$('.corner').forEach(c => {
      const sx = c.dataset.x === '1' ? 1 : -1, sy = c.dataset.y === '1' ? 1 : -1;
      const x = cxm + sx * (lerp(40, 408, cp)), y = cym + sy * lerp(8, 40, cp);
      css(c, { left: (x - (sx > 0 ? 22 : 0)) + 'px', top: (y - (sy > 0 ? 22 : 0)) + 'px', opacity: t > 2.2 ? 1 : 0 });
    });
    css('.wire', { left: (FEED_X + 800) + 'px', top: cym + 'px', width: '80px', transform: `scaleX(${E.outExpo(seg(t, 2.5, 2.9))})` });

    // 3 · sipariş no: harf panosu gibi oturur
    $$('.ono span').forEach((s, i) => {
      const settle = 2.75 + i * 0.07;
      s.textContent = t < 2.6 ? '' : t >= settle ? ONO[i] : String(Math.floor(rnd(fr * 7 + i) * 10));
      s.style.color = t >= settle ? 'var(--tx)' : 'var(--tx3)';
    });
    $('#l1').style.opacity = E.outExpo(seg(t, 2.6, 3.0));
    $('#l2').style.opacity = E.outExpo(seg(t, 2.9, 3.3));
    const cu = E.outExpo(seg(t, 2.95, 3.6));
    css('.cust', { opacity: cu, transform: `translateY(${(1 - cu) * 14}px)` });

    // 4 · durum panosu
    $$('.cellf').forEach((c, i) => {
      if (k < 0) { c.textContent = ''; c.style.opacity = E.outExpo(seg(t, 2.8 + i * 0.03, 3.1 + i * 0.03)); return; }
      c.style.opacity = 1;
      const word = WORDS[k].padEnd(NCELL, ' ');
      const settle = T[k] + 0.18 + i * 0.035;
      const prev = k > 0 ? WORDS[k - 1].padEnd(NCELL, ' ') : ' '.repeat(NCELL);
      const changing = word[i] !== prev[i] || k === 0;
      c.textContent = t >= settle || !changing ? word[i] : GLYPHS[Math.floor(rnd(fr * 13 + i * 3) * GLYPHS.length)];
      c.style.color = t >= settle ? (k === 4 ? 'var(--accent)' : 'var(--tx)') : 'var(--tx2)';
    });
    $$('.seg').forEach((s, j) => {
      s.querySelector('i').style.transform = `scaleX(${E.outExpo(seg(t, T[j] + 0.1, T[j] + 0.7))})`;
      s.querySelector('.mono').style.color = k === j ? 'var(--accent)' : k > j ? 'var(--tx2)' : 'var(--tx3)';
      s.style.opacity = E.outExpo(seg(t, 3.0 + j * 0.05, 3.4 + j * 0.05));
    });

    // 5 · koli sayacı (hazırlık adımında dolar)
    const kn = Math.round(48 * E.inOutQuart(seg(t, T[2] + 0.2, T[3] - 0.15)));
    $('#kn').textContent = String(kn).padStart(2, '0');
    $('#kn').style.color = kn === 48 ? 'var(--accent)' : '';
    $('.koli').style.opacity = E.outExpo(seg(t, 3.2, 3.7));

    // 6 · sert kesme + tipografik vuruş
    $('.end').style.display = t >= 8.0 ? 'block' : 'none';
    const slam = (sel, a) => {
      const p = E.sharp(seg(t, a, a + 0.38));
      $(sel).style.transform = `translateY(${(1 - p) * 110}%)`;
    };
    slam('.w1', 8.06); slam('.w2', 8.26); slam('.w3', 8.8);
  };
  window.render(0);
</script>
</body>
</html>
