<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>D3 · Cari ve fatura (dikey)</title>
    <link rel="stylesheet" href="assets/kit.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/hyper-shader.js"></script>
    <script src="assets/parts.js"></script>
    <script src="assets/kit.js"></script>
    <style>html, body { width: 1080px; height: 1920px; }</style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="15">
      <audio id="muzik" src="assets/muzik-d3.m4a" data-start="0" data-duration="15"></audio>
      <section id="s1" class="scene first clip" data-start="0" data-duration="15"></section>
      <section id="s2" class="scene clip" data-start="0" data-duration="15"></section>
      <section id="s3" class="scene clip" data-start="0" data-duration="15"></section>
    </div>
    <script type="application/json" id="hits">
      [{"t":0,"type":"meta","drop":4,"stop":10,"roll":7.5,"logo":10.4,"dur":15,"shift":-2},
       {"t":0,"type":"riser","d":4},{"t":0.2,"type":"whoosh","pan":-1,"d":0.8},{"t":1.0,"type":"whoosh","pan":1,"d":0.8},{"t":2.0,"type":"impact","g":0.5},
       {"t":4,"type":"impact","g":1},{"t":5.2,"type":"pop"},{"t":5.6,"type":"pop"},{"t":6.0,"type":"pop"},{"t":8.2,"type":"impact","g":0.4},
       {"t":9.6,"type":"whoosh","pan":0},{"t":10.4,"type":"impact","g":1.2},{"t":10.5,"type":"pop"}]
    </script>
    <script>
      // D3 · Cari ve fatura (15 sn, 1080×1920)
      const KAGIT = ["Fatura", "Ekstre", "Fatura", "İrsaliye", "Fatura", "Ekstre", "Dekont", "Fatura"];
      $("#s1").innerHTML = ambient(1) + `<div class="full" data-layout-allow-overlap style="perspective:1400px">${KAGIT.map((k) => `<div class="abs s1p" style="left:0;top:0;width:240px;height:310px;border-radius:12px;background:#F4F7FB;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,0.5)">
          <div style="font-size:32px;font-weight:800;color:${NAVY}">${k}</div>
          ${[0, 1, 2, 3, 4].map((j) => `<div style="height:12px;border-radius:6px;background:#C9D6E5;margin-top:${j ? 14 : 22}px;width:${[100, 80, 92, 60, 74][j]}%"></div>`).join("")}</div>`).join("")}</div>
        <div class="full center" style="padding:0 60px"><div class="scrim"><div id="s1a" class="h1" style="font-size:112px">${words("Ekstre ve fatura takibi zor mu?", 3)}</div></div></div>`;

      const R = 190, C = 2 * Math.PI * R;
      $("#s2").innerHTML = ambient(2) + `<div class="abs" style="left:70px;right:70px;top:170px;text-align:center"><div id="s2t" class="h1" style="font-size:104px">${words("Cari durumunuzu anlık görün.", 2)}</div></div>
        <div class="abs" id="s2ring" style="left:290px;top:520px;width:500px;height:500px">
          <svg width="500" height="500" viewBox="0 0 500 500"><circle cx="250" cy="250" r="${R}" fill="none" stroke="#12304f" stroke-width="44"/>
            <circle id="s2arc" cx="250" cy="250" r="${R}" fill="none" stroke="${AMBER}" stroke-width="44" stroke-linecap="round" transform="rotate(-90 250 250)" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
          <div class="full center"><div id="s2p" style="font-size:120px;font-weight:800;letter-spacing:-0.04em">%0</div><div class="soft" style="font-size:34px;font-weight:600">kredi kullanımı</div></div></div>
        <div class="abs" style="left:90px;right:90px;top:1110px;display:flex;flex-direction:column;gap:34px">
          ${[["Açık bakiye", "wallet"], ["Kullanılabilir kredi", "check"]].map(([n, ic]) => `<div class="card s2k" style="padding:34px 44px;display:flex;align-items:center;gap:30px">
            <div style="width:96px;height:96px;border-radius:22px;background:#164069;display:grid;place-items:center">${icon(ic, 56)}</div>
            <div><div class="soft" style="font-size:36px;font-weight:600">${n}</div><div class="s2v" style="font-size:72px;font-weight:800;letter-spacing:-0.03em">₺0,00</div></div></div>`).join("")}</div>`;

      $("#s3").innerHTML = endHTML(words("Cari takibi artık çok kolay.", 2));
      const tl = seriBaslat([[4, "cinematic-zoom", 0.6], [10, "cross-warp-morph", 0.8]]);

      $$(".s1p").forEach((p, i) => { const a = rnd(i * 3.7) * Math.PI * 2, x0 = 540 + Math.cos(a) * 1200, y0 = 960 + Math.sin(a) * 1300;
        const x1 = 40 + (i % 4) * 250 + rnd(i) * 30, y1 = i < 4 ? 80 + rnd(i * 8.3) * 120 : 1450 + rnd(i * 8.3) * 120;
        tl.fromTo(p, { x: x0, y: y0, rotation: rnd(i) * 360, rotationY: 60 }, { x: x1, y: y1, rotation: -25 + rnd(i * 2) * 50, rotationY: 0, duration: 1.6, ease: "power3.out" }, 0.1 + i * 0.08);
        tl.to(p, { y: `+=${30 + rnd(i) * 40}`, duration: 2.4, ease: "sine.inOut" }, 1.8); });
      rise(tl, $$("#s1a .w"), 1.1, 0.1);

      rise(tl, $$("#s2t .w"), 4.3, 0.1);
      tl.fromTo("#s2ring", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.6)" }, 4.5);
      tl.fromTo("#s2arc", { strokeDashoffset: C }, { strokeDashoffset: C * 0.94, duration: 1.6, ease: "expo.out" }, 5.2);
      countTo(tl, $("#s2p"), 5.2, 6, 1.6, (v) => "%" + Math.round(v));
      $$(".s2k").forEach((k, i) => { tl.fromTo(k, { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 5.6 + i * 0.4);
        countTo(tl, $(".s2v", k), 5.8 + i * 0.4, [15405.55, 234594.45][i], 1.6, fmt); });
      tl.fromTo($$(".s2k")[0], { boxShadow: "0 0 0 0 rgba(245,176,25,0)" }, { boxShadow: "0 0 0 6px rgba(245,176,25,0.9)", duration: 0.4 }, 8.2);

      endAnim(tl, 10, 15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
